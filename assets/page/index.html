<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Summit Home Services</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 32px 16px; background: #fafafa; color: #1a1a1a; }
    main { max-width: 640px; }
    h1 { margin: 0 0 8px; }
    #tester-task { display: none; margin-top: 24px; padding: 16px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
  </style>
  <!-- The collector must load before the widget so the session ID exists
       when the widget's init callback publishes it. -->
  <script src="collector.js"></script>
  <!-- config.js is generated by the page server from .env (NETOMI_CHANNEL_REF_ID). -->
  <script src="config.js"></script>
</head>
<body>
  <main>
    <h1>Summit Home Services</h1>
    <p>Appliance repair and installation. Questions about an order? Use the chat in the corner.</p>

    <section id="tester-task">
      <strong>Your task</strong>
      <p>Open the chat and find out where order 48213 is. Type your messages as you normally would,
        and close the tab when you're done.</p>
    </section>
  </main>

  <script>
    // Testers open the page with ?label=human; show them the task.
    if (new URLSearchParams(window.location.search).get("label") === "human") {
      document.getElementById("tester-task").style.display = "block";
    }
  </script>

  <!-- Netomi widget embed. The botRefId is the channel reference ID from config.js, so the widget
       belongs to the VA named in .env. The init callback passes the
       collector's session ID to the VA, which reads it as the
       detect_session_id_value variable. -->
  <script>
    (function() {
      var ns = document.createElement('script');
      ns.src = ('https://chatapps-us.netomi.com/app/script.js');ns.type = 'text/javascript'; ns.async = true;
      ns.setAttribute('botRefId', window.NETOMI_CHANNEL_REF_ID);
      var s = document.getElementsByTagName('script')[0];s.parentNode.insertBefore(ns, s);
      ns.onload = function () {window.Netomi.chat.init(() => {
        window.Netomi.chat.publish('VISITOR_INFO', { detect_session_id: window.detectSessionId });
      })}})();
  </script>
</body>
</html>
